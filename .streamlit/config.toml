[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FB"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
port = 10000
address = 0.0.0.0
enableXsrfProtection = false
enableCORS = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[logger]
level = "error"
